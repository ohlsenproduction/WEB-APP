<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Aufgaben</title>
<meta name="theme-color" content="#161826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aufgaben">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="app-header">
  <h1 id="header-title">Aufgaben</h1>
</header>

<main id="main">
  <section id="view-list" class="view">
    <div class="search-bar">
      <svg width="15" height="15" viewBox="0 0 15 15" class="search-icon"><circle cx="6.5" cy="6.5" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="10.2" y1="10.2" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="search" id="task-search-input" class="input search-input" placeholder="Aufgaben durchsuchen" aria-label="Aufgaben durchsuchen">
    </div>
    <div class="toolbar">
      <div class="seg" id="sort-seg" role="radiogroup" aria-label="Sortierung">
        <label class="seg-opt active"><input type="radio" name="sort" value="date" checked><span>Datum</span></label>
        <label class="seg-opt"><input type="radio" name="sort" value="label"><span>Label</span></label>
        <label class="seg-opt"><input type="radio" name="sort" value="status"><span>Status</span></label>
        <label class="seg-opt"><input type="radio" name="sort" value="alpha"><span>A&ndash;Z</span></label>
      </div>
      <div class="filter-chips" id="filter-chips"></div>
    </div>
    <ul id="task-list" class="task-list"></ul>
    <div id="task-empty" class="empty-state hidden">
      <svg width="48" height="48" viewBox="0 0 56 56"><circle cx="28" cy="28" r="26" fill="none" stroke="var(--color-neutral-700)" stroke-width="1.6" stroke-dasharray="4 5"/><path d="M18 29l7 7 13-15" stroke="var(--color-neutral-600)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="empty-state-title">Keine Aufgaben</div>
      <div class="empty-state-sub">Leg deine erste Aufgabe an, um loszulegen.</div>
      <button type="button" class="btn btn-primary" id="empty-add-btn">+ Aufgabe erstellen</button>
    </div>
  </section>

  <section id="view-calendar" class="view hidden">
    <div class="calendar-nav">
      <button id="cal-prev" class="icon-btn" aria-label="Vorheriger Monat" type="button">
        <svg width="9" height="15" viewBox="0 0 9 15"><path d="M8 1L1 7.5 8 14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 id="cal-month-label"></h2>
      <button id="cal-next" class="icon-btn" aria-label="Nächster Monat" type="button">
        <svg width="9" height="15" viewBox="0 0 9 15"><path d="M1 1l7 6.5L1 14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="calendar-weekdays" id="cal-weekdays"></div>
    <div class="calendar-grid" id="cal-grid"></div>
  </section>

  <section id="view-labels" class="view hidden">
    <ul id="label-list" class="label-list"></ul>
    <p id="label-empty" class="empty-state hidden">Noch keine Labels angelegt.</p>
  </section>
</main>

<button id="fab-add" class="fab" aria-label="Neu hinzufügen" type="button">
  <svg width="20" height="20" viewBox="0 0 20 20"><rect x="9" y="2" width="2" height="16" rx="1" fill="currentColor"/><rect x="2" y="9" width="16" height="2" rx="1" fill="currentColor"/></svg>
</button>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="list" type="button">
    <svg width="20" height="14" viewBox="0 0 20 14"><rect y="0" width="20" height="2.4" rx="1.2" fill="currentColor"/><rect y="5.8" width="20" height="2.4" rx="1.2" fill="currentColor"/><rect y="11.6" width="20" height="2.4" rx="1.2" fill="currentColor"/></svg>
    <span>Liste</span>
  </button>
  <button class="nav-btn" data-view="calendar" type="button">
    <svg width="18" height="18" viewBox="0 0 18 18"><rect x="1" y="1" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="1" y1="6.5" x2="17" y2="6.5" stroke="currentColor" stroke-width="1.5"/></svg>
    <span>Kalender</span>
  </button>
  <button class="nav-btn" data-view="labels" type="button">
    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(45 8 8)"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/></svg>
    <span>Labels</span>
  </button>
</nav>

<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-container" class="modal-container" role="dialog" aria-modal="true"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
